name: BTC Hybrid Bot Cron Job

# यह तय करता है कि बोट कब-कब ऑटोमैटिक रन होगा (हर 1 घंटे में एक बार)
on:
  schedule:
    - cron: '0 * * * *' # हर घंटे की शुरुआत में (UTC समय के अनुसार)
  workflow_dispatch: # आप चाहें तो इसे GitHub पर जाकर मैन्युअली भी चला सकते हैं

jobs:
  run-hybrid-bot:
    runs-on: ubuntu-latest

    steps:
    # 1. रिपॉजिटरी से कोड चेकआउट करना
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. पाइथन एनवायरनमेंट सेटअप करना
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. जरूरी लाइब्रेरीज (Pandas और Requests) इंस्टॉल करना
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas requests

    # 4. आपके नए हाइब्रिड बोट की पाइथन फाइल को रन करना
    - name: Run Hybrid Bot Script
      run: python btc_hybrid_trading_bot.py
