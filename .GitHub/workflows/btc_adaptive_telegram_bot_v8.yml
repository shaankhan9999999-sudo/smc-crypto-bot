name: BTC Adaptive Telegram Bot V8

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

# Prevent two V8 runs from trying to push state at the same time.
concurrency:
  group: btc-adaptive-telegram-bot-v8
  cancel-in-progress: false

jobs:
  btc-bot:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ======================================================
      # PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ======================================================
      # DEPENDENCIES
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy

      # ======================================================
      # PYTHON SYNTAX CHECK
      # ======================================================

      - name: Check Python syntax
        run: |
          python -m py_compile btc_adaptive_telegram_bot_v8.py

      # ======================================================
      # RUN V8 BOT
      # ======================================================

      - name: Run BTC Adaptive Telegram Bot V8
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CRYPTOPANIC_API_KEY: ${{ secrets.CRYPTOPANIC_API_KEY }}
          NEWS_ENABLED: "1"
        run: |
          python btc_adaptive_telegram_bot_v8.py --once

      # ======================================================
      # DEBUG FILES
      # ======================================================

      - name: Debug V8 files
        if: always()
        run: |
          echo "===== CURRENT DIRECTORY ====="
          pwd

          echo "===== ROOT FILES ====="
          ls -la

          echo "===== LOGS DIRECTORY ====="
          if [ -d logs ]; then
            ls -la logs
          else
            echo "logs directory does NOT exist"
          fi

          echo "===== V8 STATE FILE ====="
          if [ -f btc_v8_state.json ]; then
            echo "btc_v8_state.json EXISTS"
            ls -lh btc_v8_state.json
          else
            echo "btc_v8_state.json DOES NOT EXIST"
          fi

          echo "===== V8 JOURNAL FILE ====="
          if [ -f btc_v8_journal.jsonl ]; then
            echo "btc_v8_journal.jsonl EXISTS"
            ls -lh btc_v8_journal.jsonl
          else
            echo "btc_v8_journal.jsonl DOES NOT EXIST"
          fi

          echo "===== V8 CALIBRATION FILE ====="
          if [ -f btc_v8_calibration.json ]; then
            echo "btc_v8_calibration.json EXISTS"
            ls -lh btc_v8_calibration.json
          else
            echo "btc_v8_calibration.json DOES NOT EXIST"
          fi

          echo "===== V8 CSV FILE ====="
          if [ -f logs/btc_v8_signals.csv ]; then
            echo "logs/btc_v8_signals.csv EXISTS"
            ls -lh logs/btc_v8_signals.csv
          else
            echo "logs/btc_v8_signals.csv DOES NOT EXIST"
          fi

      # ======================================================
      # SAVE V8 STATE
      # ======================================================

      - name: Save V8 bot state
        if: always()
        run: |
          git config user.name "BTC Adaptive Bot"
          git config user.email "actions@github.com"

          git add btc_v8_state.json 2>/dev/null || true
          git add btc_v8_journal.jsonl 2>/dev/null || true
          git add btc_v8_calibration.json 2>/dev/null || true
          git add logs/btc_v8_signals.csv 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update BTC V8 bot state"

            echo "===== SYNCING WITH REMOTE MAIN ====="
            git pull --rebase origin main

            echo "===== PUSHING V8 STATE ====="
            git push origin main
          fi
