name: Scalp Bot Cron

on:
  schedule:
    - cron: '*/5 * * * *'  # हर 5 मिनट पर ऑटोमैटिक चलेगा
  workflow_dispatch:      # मैन्युअल रूप से रन करने के लिए

jobs:
  run-scalp-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Run Scalp Bot
        run: |
          python bot.py
