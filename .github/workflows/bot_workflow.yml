name: Coinbase SMC Scalping Cron Bot

on:
  schedule:
    - cron: '*/5 * * * *'  # Har 5 minute me run hoga
  workflow_dispatch:      # Manual run button ke liye

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies Directly
        run: |
          pip install requests pandas numpy

      - name: Run Scalping Bot
        run: python bot.py
