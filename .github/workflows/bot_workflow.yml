name: Coinbase SMC Scalping Cron Bot

on:
  schedule:
    - cron: '*/5 * * * *' # यह लाइन हर 5 मिनट में बॉट को ऑटोमैटिक चलाएगी
  workflow_dispatch: # इससे आप चाहें तो खुद भी मैन्युअल 'Run workflow' बटन दबा सकते हैं

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies Directly
      run: |
        python -m pip install --upgrade pip
        pip install ccxt pandas requests numpy

    - name: Run Scalping Bot
      run: |
        python bot.py
