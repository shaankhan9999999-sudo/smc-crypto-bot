हाँ भाई। एक बहुत जरूरी correction पहले: अगर हमारा V5 Python bot लगातार WebSocket/live order-flow सुनता है, तो उसे हर 5 मिनट में नया process शुरू करना सही तरीका नहीं है। GitHub का cron: '*/5 * * * *' workflow को हर 5 मिनट में start करेगा, लेकिन वह continuous bot को 5-minute scheduler नहीं बनाता। GitHub scheduled workflows का shortest interval 5 minutes है और schedule कभी-कभी delay भी हो सकता है। �
GitHub Docs +1
इसलिए bot.yml में एक बार bot start करना चाहिए; और Backtest/Status अलग manual workflows रहेंगे।
bot.yml — यही पूरा code paste करो
GitHub में:
.github/workflows/bot.yml
बनाकर यह paste करो:
name: BTC Telegram Bot

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy websocket-client

      - name: Start BTC Telegram Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python btc_adaptive_bot_v5.py
यह अंदर से कैसे काम करेगा?
जब तुम GitHub में:
Actions → BTC Telegram Bot → Run workflow
दबाओगे, sequence यह होगा:
GitHub
   ↓
bot.yml
   ↓
Repository की files download
   ↓
Python 3.12 start
   ↓
requests / pandas / numpy / websocket-client install
   ↓
TELEGRAM_BOT_TOKEN Secret
TELEGRAM_CHAT_ID Secret
   ↓
btc_adaptive_bot_v5.py
   ↓
BTC data + WebSocket
   ↓
Signal Engine
   ↓
Telegram Alert
Secrets को YAML में सीधे लिखना नहीं है; GitHub उन्हें ${{ secrets.NAME }} के जरिए workflow को देता है। �
GitHub Docs
और Backtest/Status?
उनके लिए अलग YAML रख सकते हो:
.github/workflows/
│
├── bot.yml
├── backtest.yml
└── status.yml
backtest.yml में:
name: BTC Backtest

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests pandas numpy websocket-client

      - name: Run Backtest
        run: |
          python btc_adaptive_bot_v5.py --backtest 60
और status.yml में:
name: BTC Bot Status

on:
  workflow_dispatch:

jobs:
  status:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests pandas numpy websocket-client

      - name: Check Status
        run: |
          python btc_adaptive_bot_v5.py --status
workflow_dispatch लगाने से GitHub Actions में Run workflow button मिलता है। �
GitHub Docs
तो final setup:
btc-adaptive-bot/
│
├── btc_adaptive_bot_v5.py
│
└── .github/
    └── workflows/
        ├── bot.yml        ← असली Telegram bot
        ├── backtest.yml   ← manual backtest
        └── status.yml     ← manual status
और हाँ—GitHub में YAML files हमेशा .github/workflows/ के अंदर ही रखनी हैं। �
