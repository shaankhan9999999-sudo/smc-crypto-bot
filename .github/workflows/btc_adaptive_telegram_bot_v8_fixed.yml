name: BTC Adaptive Telegram Bot V8

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy

      - name: Check bot file
        run: |
          ls -la
          test -f btc_adaptive_telegram_bot_v8_fixed.py

      - name: Run BTC Adaptive Bot V8
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CRYPTOPANIC_API_KEY: ${{ secrets.CRYPTOPANIC_API_KEY }}
          NEWS_ENABLED: "1"
        run: |
          python btc_adaptive_telegram_bot_v8_fixed.py --once

          echo "===== BOT JOURNAL ====="
          if [ -f btc_v8_journal.jsonl ]; then
            cat btc_v8_journal.jsonl
          else
            echo "Journal file was NOT created"
          fi

          echo "===== STATE ====="
          if [ -f btc_v8_state.json ]; then
            cat btc_v8_state.json
          else
            echo "State file was NOT created"
          fi
