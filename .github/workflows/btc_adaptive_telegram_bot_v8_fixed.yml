- name: Run BTC Adaptive Bot V8
  env:
    TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    CRYPTOPANIC_API_KEY: ${{ secrets.CRYPTOPANIC_API_KEY }}
    NEWS_ENABLED: "1"
  run: |
    python btc_adaptive_telegram_bot_v8_fixed.py --once

    echo "===== BOT JOURNAL ====="
    if [ -f btc_v8_journal.jsonl ]; then
      cat btc_v8_journal.jsonl
    else
      echo "Journal file was NOT created"
    fi

    echo "===== STATE ====="
    if [ -f btc_v8_state.json ]; then
      cat btc_v8_state.json
    else
      echo "State file was NOT created"
    fi
