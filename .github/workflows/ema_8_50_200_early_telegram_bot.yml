name: EMA 8 50 200 Early Telegram Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: ema-8-50-200-bot
  cancel-in-progress: false

jobs:
  run-ema-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      STATE_FILE: ema_bot_state.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore bot state
        uses: actions/cache/restore@v4
        with:
          path: ema_bot_state.json
          key: ema-bot-state-${{ github.run_id }}
          restore-keys: | ema-bot-state- 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: | python -m pip install --upgrade pip pip install requests 
      - name: Run one EMA scan
        run: | python ema_8_50_200_early_telegram_bot.py 
      - name: Save bot state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ema_bot_state.json
          key: ema-bot-state-${{ github.run_id }}
