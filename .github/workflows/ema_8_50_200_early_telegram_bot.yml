name: EMA 8 50 200 Early Telegram Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: ema-8-50-200-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-ema-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install requests pandas

      - name: Run EMA bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          XAU_LOOKBACK_HOURS: '270'
          DUKA_WORKERS: '16'
        run: python ema_8_50_200_early_telegram_bot.py

      - name: Persist bot state
        run: | if git diff --quiet -- ema_bot_state.json; then echo "No state change." exit 0 fi git config user.name 'github-actions[bot]' git config user.email '41898282+github-actions[bot]@users.noreply.github.com' git add ema_bot_state.json git commit -m 'chore: update EMA bot state' git push
