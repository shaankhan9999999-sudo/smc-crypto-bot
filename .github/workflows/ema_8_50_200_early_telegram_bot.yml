name: EMA 8 50 200 Early Telegram Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: ema-8-50-200-early
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run EMA bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          XAU_STATE_URL: ${{ secrets.XAU_STATE_URL }}
          XAU_STATE_TOKEN: ${{ secrets.XAU_STATE_TOKEN }}
          COINBASE_PRODUCT: BTC-USD
          STATE_FILE: ema_bot_state.json
        run: python ema_8_50_200_early_telegram_bot.py

      - name: Persist duplicate-protection state
        run: | git config user.name "github-actions[bot]" git config user.email "41898282+github-actions[bot]@users.noreply.github.com" git add ema_bot_state.json if git diff --cached --quiet; then echo "No state changes to commit." else git commit -m "chore: update EMA bot state" git push fi
