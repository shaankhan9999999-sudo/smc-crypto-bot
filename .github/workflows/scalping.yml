name: Scalping Bot

on:
  schedule:
    - cron: '*/5 * * * *'  # हर 5 मिनट में चलेगा
  workflow_dispatch:      # मैन्युअल रन करने के लिए

jobs:
  scalp-scan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas numpy yfinance

    - name: Run Scalping Bot
      run: python scalping.py
      env:
        TELEGRAM_BOT_TOKEN: '8662975391:AAG86xC9Dcx-Ec9ljKveAnnNqtk4jqDkdrO'
        TELEGRAM_CHAT_ID: '7500472109'
