name: BTC Adaptive Telegram Bot V5

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: btc-adaptive-v5
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run-bot:
    name: Run BTC V5 one-shot scan
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run BTC V5
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          python btc_adaptive_telegram_bot_v5_github.py --once

      - name: Persist bot state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add btc_v5_state.json btc_v5_journal.jsonl btc_v5_calibration.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No bot state changes to commit."
          else
            git commit -m "chore: persist BTC V5 bot state"
            git push
          fi
