name: BTC Adaptive Telegram Bot V7

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  btc-bot:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy

      - name: Run BTC Adaptive Telegram Bot V7
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CRYPTOPANIC_API_KEY: ${{ secrets.CRYPTOPANIC_API_KEY }}
          NEWS_ENABLED: "1"
        run: |
          python btc_adaptive_telegram_bot_v7.py --once

      - name: Save V7 bot state
        run: |
          git config user.name "BTC Adaptive Bot"
          git config user.email "actions@github.com"

          git add btc_v7_state.json
          git add btc_v7_journal.jsonl
          git add btc_v7_calibration.json
          git add logs/btc_v7_signals.csv

          git diff --cached --quiet || git commit -m "Update BTC V7 bot state"

          git push
