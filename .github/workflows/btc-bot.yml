name: BTC Adaptive Telegram Bot V8

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy

      - name: Check bot file
        run: |
          ls -la
          test -f btc_adaptive_telegram_bot_v8_fixed.py

      - name: Test Telegram Connection
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.getenv("TELEGRAM_BOT_TOKEN", "")
          chat_id = os.getenv("TELEGRAM_CHAT_ID", "")

          if not token:
              raise SystemExit("ERROR: TELEGRAM_BOT_TOKEN is missing")

          if not chat_id:
              raise SystemExit("ERROR: TELEGRAM_CHAT_ID is missing")

          r = requests.get(
              f"https://api.telegram.org/bot{token}/getChat",
              params={"chat_id": chat_id},
              timeout=20
          )

          print("Telegram HTTP status:", r.status_code)
          print("Telegram response:", r.text)

          r.raise_for_status()
          PY

      - name: Run BTC Adaptive Bot V8
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CRYPTOPANIC_API_KEY: ${{ secrets.CRYPTOPANIC_API_KEY }}
          NEWS_ENABLED: "1"
        run: |
          python btc_adaptive_telegram_bot_v8_fixed.py --once

      - name: Show generated logs
        if: always()
        run: |
          echo "===== LOG DIRECTORY ====="
          if [ -d logs ]; then
            find logs -type f -maxdepth 4 -print
          else
            echo "logs directory was NOT created"
          fi

          echo ""
          echo "===== JOURNAL ====="
          if [ -f logs/journal/btc_v8_journal.jsonl ]; then
            cat logs/journal/btc_v8_journal.jsonl
          else
            echo "Journal file was NOT created"
          fi

          echo ""
          echo "===== STATE ====="
          if [ -f logs/state/btc_v8_state.json ]; then
            cat logs/state/btc_v8_state.json
          else
            echo "State file was NOT created"
          fi

          echo ""
          echo "===== CALIBRATION ====="
          if [ -f logs/calibration/btc_v8_calibration.json ]; then
            cat logs/calibration/btc_v8_calibration.json
          else
            echo "Calibration file was NOT created"
          fi

          echo ""
          echo "===== SIGNAL CSV ====="
          if [ -f logs/csv/btc_v8_signals.csv ]; then
            cat logs/csv/btc_v8_signals.csv
          else
            echo "Signal CSV was NOT created"
          fi

          echo ""
          echo "===== SCAN CSV ====="
          if [ -f logs/csv/btc_v8_scans.csv ]; then
            cat logs/csv/btc_v8_scans.csv
          else
            echo "Scan CSV was NOT created"
          fi

      - name: Commit and push logs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add logs/

          if git diff --cached --quiet; then
            echo "No log/state changes to commit."
          else
            git commit -m "Update BTC bot logs and state"
            git push
          fi
