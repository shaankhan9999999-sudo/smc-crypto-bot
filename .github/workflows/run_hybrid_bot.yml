name: Run Dual-Volume Hybrid Bot Script

on:
  schedule:
    - cron: '*/15 * * * *'  # अब यह बोट हर 15 मिनट पर स्वचालित रूप से ट्रिगर होगा
  workflow_dispatch:        # इससे आप गिटहब से मैन्युअली भी एक क्लिक पर रन कर सकते हैं

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Run Hybrid Bot Script
        run: |
          python bot.py  
          # (नोट: यदि आपकी पाइथन फाइल का नाम 'bot.py' की जगह कुछ और है, 
          # जैसे 'main.py' या 'hybrid_bot.py', तो यहाँ नीचे वाली लाइन में नाम बदल लें)
